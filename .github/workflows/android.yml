name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [maleoon]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache glslang-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches
          key: eden-${{ github.sha }}
          restore-keys: eden-
      - name: Install SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - name: Build
        working-directory: src/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
        run: ./gradlew assembleLegacyRelease --no-daemon --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: eden-maleoon-apk
          path: src/android/app/build/outputs/apk/legacy/release/*.apk
